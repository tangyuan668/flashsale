# Redis Windows 配置文件

# 绑定地址
bind 127.0.0.1

# 端口
port 6379

# 后台运行（Windows不支持，改为no）
daemonize no

# 数据库数量
databases 16

# RDB持久化
save 900 1
save 300 10
save 60 10000

# AOF持久化（可选，开启会更安全但性能略低）
appendonly yes
appendfilename "appendonly.aof"

# 日志
loglevel notice
logfile ""

# 最大内存（根据需要调整，如不限制则注释掉）
# maxmemory 2gb
# maxmemory-policy allkeys-lru
