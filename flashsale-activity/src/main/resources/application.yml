server:
  port: 8082
  address: 127.0.0.1

spring:
  application:
    name: flashsale-activity
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: flashsale
        ip: 127.0.0.1
      config:
        server-addr: localhost:8848
        namespace: flashsale
        file-extension: yml
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flashsale_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 64
          min-idle: 16

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging
logging:
  level:
    com.flashsale: debug
